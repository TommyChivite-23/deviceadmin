name: CI

# Runs on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Public-repo hygiene audit (secrets, real-looking IPs/emails/phones)
        run: python scripts/audit_public_repo.py

      - name: Run tests
        run: pytest --cov=deviceadmin --cov-report=term-missing
